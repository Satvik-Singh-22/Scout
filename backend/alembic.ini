# Banquoite — Alembic Configuration
# https://alembic.sqlalchemy.org/en/latest/

[alembic]

# Path to migration scripts (relative to this file)
script_location = db/migrations

# Template used for generating new revision files
# file_template = %%(rev)s_%%(slug)s

# sys.path prepend — ensures 'backend' package is importable
prepend_sys_path = .

# Timezone for revision timestamps
# timezone =

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .hierarchical_merge() in 'alembic revision' when
# the "downgrade" attribute of the generated script contains no operations.
# post_write_hooks =

# NOTE: sqlalchemy.url is set dynamically in env.py from DATABASE_URL
# Do NOT hardcode connection strings here.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
